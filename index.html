*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar{display:flex;align-items:center;gap:8px;padding-block:0 10px}
.mbar label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.mbar select{padding:7px 10px;font-weight:700}
.demo{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:4px 8px;border-radius:99px;white-space:nowrap}
main .wrap{padding-block:16px 110px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:13px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

button,.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}

.btn-block{width:100%}
.btn-s{padding:7px 10px;font-size:13px}
.link{background:none;border:0;color:var(--accent);padding:0;font-weight:700;cursor:pointer}

.s-recu{color:var(--muted);background:var(--sunk)}
.s-diag{color:var(--info);background:var(--info-soft)}
.s-piece{color:var(--warn);background:var(--warn-soft)}
.s-rep{color:var(--accent);background:var(--accent-soft)}
.s-pret{color:var(--good);background:var(--good-soft)}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink);width:100%;font-weight:500}
.item:hover{border-color:var(--accent)}
.item .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.steps i{height:6px;border-radius:3px;background:var(--line)}

th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--sunk)}

nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--accent)}
nav.tabs a.new span.ic{background:var(--accent);color:var(--on-accent);border-radius:10px;padding:3px 12px;display:flex}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.client-hero{background:var(--navy);color:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px}
.client-hero .big{font-size:26px;font-weight:800;letter-spacing:-.02em}
.note{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.item,button{transition:border-color .15s,background .15s}}

.err{color:var(--crit);font-weight:600;font-size:14px}
.btn[disabled]{opacity:.55;cursor:wait}
.out{color:var(--crit)}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>(Math.round(n)||0).toLocaleString('fr-FR')+' €';
const fd=d=>new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
const fdt=d=>new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const sid=n=>'R-'+String(n||0).padStart(4,'0');
let toastT;
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function fail(e,msg){console.error(e);toast(msg||'Problème de connexion. Réessaie dans un instant.')}
async function copy(txt,el){try{await navigator.clipboard.writeText(txt);toast('Copié')}catch(e){if(el){el.focus();el.select&&el.select()}toast('Sélectionne le texte et copie-le')}}
const chip=st=>`<span class="chip ${SC[st]}">${ST[st]}</span>`;

const waNum=t=>{let n=String(t||'').replace(/\D/g,'');if(n.startsWith('0'))n='33'+n.slice(1);return n};
const trackUrl=tok=>location.origin+location.pathname+'#suivi-'+tok;
function busy(b,on,txt){if(!b)return;if(on){b.dataset.t=b.textContent;b.disabled=true;b.textContent=txt||'Envoi…'}else{b.disabled=false;b.textContent=b.dataset.t||b.textContent}}
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};

function toRep(r,hist){return {id:r.id,num:r.numero,client:r.client,tel:r.telephone||'',model:r.article||'',panne:r.prestation||'',prix:+r.prix||0,cout:+r.cout||0,st:r.statut,date:r.created_at,hist:hist.length?hist:[{s:0,d:r.created_at}],tests:r.tests||[],etat:r.etat||'',imei:r.numero_serie||'',photo:r.photo_path,sig:r.signature_path,token:r.suivi_token}}

async function loadAll(){
  if(loading)return;loading=true;
  chrome(false);app().innerHTML='<div class="loading">Chargement de ton atelier…</div>';
  try{
    const {data:at,error}=await sb.from('ateliers').select('*').limit(1).maybeSingle();
    if(error)throw error;
    if(!at){A=null;loading=false;vOnboard();return}
    A=at;setM(A.metier);
    const [t,f,h]=await Promise.all([
      sb.from('tarifs').select('*').eq('atelier_id',A.id).order('article').order('prestation'),
      sb.from('fiches').select('*').eq('atelier_id',A.id).order('created_at',{ascending:false}),
      sb.from('historique').select('fiche_id,statut,at').order('at')
    ]);
    for(const x of [t,f,h])if(x.error)throw x.error;
    GRID=t.data.map(r=>({id:r.id,model:r.article,panne:r.prestation,prix:+r.prix||0,cout:+r.cout||0}));
    const H={};h.data.forEach(x=>(H[x.fiche_id]=H[x.fiche_id]||[]).push({s:x.statut,d:x.at}));
    REPS=f.data.map(r=>toRep(r,H[r.id]||[]));
    loading=false;render();
  }catch(e){loading=false;console.error(e);
    app().innerHTML=`<div class="card"><h1>Connexion impossible</h1><p class="err">${esc(e.message||e)}</p><p class="small muted" style="margin:0">Vérifie que les tables Supabase sont bien créées, puis recharge la page.</p><button class="btn" id="retry">Réessayer</button></div>`;
    $('#retry').onclick=loadAll}
}

function vLogin(msg){
  chrome(false);
  let mode='in';
  const draw=()=>{
  app().innerHTML=`<div class="card login"><h1>${mode==='in'?'Connexion à ton atelier':'Créer ton compte'}</h1>
    ${msg?`<p class="err" style="margin:0">${esc(msg)}</p>`:''}
    <form id="lf" class="list" novalidate>
      <label class="f">E-mail<input id="l-mail" type="email" autocomplete="email" inputmode="email" placeholder="atelier@exemple.fr"></label>
      <label class="f">Mot de passe<input id="l-pass" type="password" autocomplete="${mode==='in'?'current-password':'new-password'}" placeholder="${mode==='in'?'Ton mot de passe':'8 caractères minimum'}"></label>
      <button class="btn btn-p btn-block" type="submit" id="l-go">${mode==='in'?'Se connecter':'Créer mon compte'}</button></form>
    <button class="link small" id="l-sw" style="align-self:flex-start">${mode==='in'?'Pas encore de compte ? Créer un compte':'Déjà un compte ? Se connecter'}</button></div>`;
  $('#l-sw').onclick=()=>{mode=mode==='in'?'up':'in';msg='';const m=$('#l-mail').value;draw();$('#l-mail').value=m};
  $('#lf').onsubmit=async e=>{e.preventDefault();
    const email=$('#l-mail').value.trim().toLowerCase(),password=$('#l-pass').value;
    if(!/^\S+@\S+\.\S+$/.test(email)){toast('Entre une adresse e-mail valide');return}
    if(password.length<8){toast('Le mot de passe doit faire au moins 8 caractères');return}
    const b=$('#l-go');busy(b,true,mode==='in'?'Connexion…':'Création…');
    if(mode==='in'){
      const {error}=await sb.auth.signInWithPassword({email,password});
      busy(b,false);
      if(error){fail(error,/invalid/i.test(error.message)?'E-mail ou mot de passe incorrect.':'Connexion impossible : '+error.message)}
    }else{
      const {data,error}=await sb.auth.signUp({email,password});
      busy(b,false);
      if(error){fail(error,/registered|exists/i.test(error.message)?'Ce compte existe déjà. Connecte-toi.':'Création impossible : '+error.message);return}
      if(!data.session){toast('Compte créé. Valide l\'e-mail reçu, puis connecte-toi.');mode='in';draw();$('#l-mail').value=email}
    }
  };
  };
  draw();
}

let photoData=null,sigDrawn=false;
async function upload(path,dataUrl,type){
  const blob=await (await fetch(dataUrl)).blob();
  const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:type,upsert:true});
  if(error)throw error;return path;
}
function bindNew(){
  photoData=null;sigDrawn=false;
  const m=$('#n-model');if(!m)return;
  const p=$('#n-panne'),pr=$('#n-prix'),mg=$('#n-marge');
  const cur=()=>pannesFor(m.value).find(g=>g.panne===p.value);
  const mg2=()=>{const g=cur();const v=+pr.value||0;mg.textContent=g?`Fourniture ${eur(g.cout)} · marge ${eur(v-g.cout)}`:''};
  const upd=()=>{const g=cur();if(g)pr.value=g.prix;mg2()};
  const fill=()=>{p.innerHTML=pannesFor(m.value).map(g=>`<option>${esc(g.panne)}</option>`).join('');upd()};
  m.onchange=fill;p.onchange=upd;pr.oninput=mg2;fill();
  $('#n-photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.75);const pv=$('#n-prev');pv.src=photoData;pv.hidden=false};im.src=rd.result};rd.readAsDataURL(f)};
  const cv=$('#sig'),ctx=cv.getContext('2d');
  const r0=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r0.width*dpr;cv.height=r0.height*dpr;ctx.scale(dpr,dpr);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.strokeStyle=getComputedStyle(document.body).color;
  let dn=false;const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{dn=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y)};
  cv.onpointermove=e=>{if(!dn)return;const[x,y]=pt(e);ctx.lineTo(x,y);ctx.stroke();sigDrawn=true};
  cv.onpointerup=cv.onpointercancel=()=>dn=false;
  $('#sig-clear').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);sigDrawn=false};
  $('#nf').onsubmit=async e=>{e.preventDefault();
    const client=$('#n-client').value.trim();if(!client){toast('Indique le nom du client');$('#n-client').focus();return}
    if(!$('#n-ok').checked){toast('Le client doit accepter le devis');return}
    const b=$('#n-go');busy(b,true,'Enregistrement…');
    const id=crypto.randomUUID(),g=cur();let photo_path=null,signature_path=null,lost=false;
    try{if(photoData)photo_path=await upload(`${A.id}/${id}/photo.jpg`,photoData,'image/jpeg')}catch(err){console.error(err);lost=true}
    try{if(sigDrawn)signature_path=await upload(`${A.id}/${id}/signature.png`,cv.toDataURL('image/png'),'image/png')}catch(err){console.error(err);lost=true}
    const row={id,atelier_id:A.id,client,telephone:$('#n-tel').value.trim(),article:m.value,prestation:p.value,prix:+pr.value||0,cout:g?g.cout:0,statut:0,
      tests:TESTS.filter((t,i)=>$('#t'+i).checked),etat:$('#n-etat').value.trim(),numero_serie:$('#n-imei')?$('#n-imei').value.trim():null,photo_path,signature_path};
    const {data,error}=await sb.from('fiches').insert(row).select().single();
    if(error){busy(b,false);fail(error,"La fiche n'a pas été enregistrée. Vérifie ta connexion et réessaie.");return}
    REPS.unshift(toRep(data,[{s:0,d:data.created_at}]));
    toast(lost?'Fiche enregistrée, mais la photo ou la signature n\'a pas pu être envoyée':'Prise en charge enregistrée');
    location.hash='fiche-'+id;
  };
}

async function setSt(r,s,el){
  if(el)el.disabled=true;
  const {error}=await sb.from('fiches').update({statut:s}).eq('id',r.id);

  r.st=s;r.hist.push({s,d:new Date().toISOString()});render();toast('Statut : '+ST[s]);
}
function bindFiche(id){
  const r=REPS.find(x=>x.id===id);if(!r)return;
  $('[data-back]').onclick=()=>location.hash='reparations';
  const a=$('#adv');if(a)a.onclick=()=>setSt(r,r.st+1,a);
  $('#st').onchange=e=>setSt(r,+e.target.value,e.target);
  $('#cplink').onclick=()=>copy(trackUrl(r.token));
  const c=$('#cpmsg');if(c)c.onclick=()=>copy(readyMsg(r),$('#msg'));
  document.querySelectorAll('img[data-path]').forEach(async im=>{
    const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(im.dataset.path,3600);
    if(error){im.replaceWith(Object.assign(document.createElement('div'),{className:'small muted',textContent:'Image indisponible.'}));return}
    im.src=data.signedUrl});
}

// ===== Page de suivi client (publique) =====
async function vSuivi(tok){
  const mine=USER&&REPS.find(r=>r.token===tok);
  chrome(!!mine);
  if(!mine){$('#shopName').textContent=''}
  app().innerHTML='<div class="loading">Chargement du suivi…</div>';
  const {data,error}=await sb.rpc('suivi',{p_token:tok});
  if(error||!data){app().innerHTML=`<div class="card"><h1>Suivi introuvable</h1><p class="small muted" style="margin:0">Ce lien n'est plus valable. Contacte l'atelier.</p></div>`;return}
  setM(data.metier);
  if(!mine)$('#shopName').textContent=data.atelier;
  const st=data.statut;
  const txt=['Bien reçu à l\'atelier.','L\'artisan examine le travail à faire.','On attend une pièce ou une fourniture. On vous prévient dès réception.','C\'est entre les mains de l\'artisan.','C\'est prêt ! Vous pouvez venir le récupérer.','Rendu. Merci pour votre confiance.'][st];
  app().innerHTML=`${mine?`<p class="note" style="margin:0">Ce que voit ton client · <button class="link small" data-back>retour à la fiche</button></p>`:''}
  <div class="client-hero"><span class="small" style="opacity:.75">${esc(data.atelier)}</span><span class="big">${esc(data.article)}</span><span>${esc(data.prestation)} · n° <span class="mono">${sid(data.numero)}</span></span></div>
  <div class="card"><div class="row between"><b>${ST[st]}</b>${chip(st)}</div><div>${txt}</div>
    <div class="steps">${ST.map((s,i)=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>
    <div class="steps-l">${ST.map((s,i)=>`<span class="${i===st?'on':''}">${s}</span>`).join('')}</div></div>
  <div class="card"><div class="row between"><span>Montant du devis</span><b class="mono">${eur(data.prix)}</b></div>
    <div class="row between small muted"><span>Déposé le</span><span>${fdt(data.depose_le)}</span></div>
    <div class="row between small muted"><span>Garantie</span><span>${data.garantie_mois} mois</span></div></div>
  ${data.telephone?`<div class="card"><h2>Une question ?</h2><span class="mono" style="user-select:all">${esc(data.telephone)}</span></div>`:''}`;
  if(mine){setM(A.metier);const b=$('[data-back]');if(b)b.onclick=()=>location.hash='fiche-'+mine.id}
}

// ===== Tableau de bord =====
function vTableau(){
  const now=new Date(),mo=d=>{d=new Date(d);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()};
  const rendusM=REPS.filter(r=>{const h=r.hist.filter(x=>x.s===5).pop();return r.st===5&&h&&mo(h.d)});
  const ca=rendusM.reduce((a,r)=>a+r.prix,0),cout=rendusM.reduce((a,r)=>a+r.cout,0);
  const enc=REPS.filter(r=>r.st<4).length,prets=REPS.filter(r=>r.st===4);
  const byS=ST.map((s,i)=>REPS.filter(r=>r.st===i).length),mx=Math.max(1,...byS);
  const pc={};REPS.forEach(r=>pc[r.panne]=(pc[r.panne]||0)+1);const top=Object.entries(pc).sort((a,b)=>b[1]-a[1]).slice(0,5),mx2=Math.max(1,...top.map(t=>t[1]));
  const mois=now.toLocaleDateString('fr-FR',{month:'long'});
  return `<h1>Tableau de bord</h1>
  <div class="kpis">
    <div class="kpi"><b>${enc}</b><span>${M.liste} en cours</span></div>
    <div class="kpi"><b style="color:var(--good)">${prets.length}</b><span>Prêts à récupérer</span></div>
    <div class="kpi"><b>${eur(ca)}</b><span>Travaux rendus en ${mois}</span></div>
    <div class="kpi"><b>${ca?Math.round((ca-cout)/ca*100):0} %</b><span>Marge en ${mois} (${eur(ca-cout)})</span></div>
  </div>
  ${prets.length?`<div class="card"><h2>À prévenir ou à rendre</h2><div class="list">${prets.map(r=>`<button class="item" data-open="${r.id}"><span class="t">${esc(r.client)}</span><span class="p">${eur(r.prix)}</span><span class="d">${esc(r.model)} · ${esc(r.panne)}</span><span>${chip(4)}</span></button>`).join('')}</div></div>`:''}
  <div class="card"><h2>Fiches par statut</h2><div class="bars">${ST.map((s,i)=>`<div class="bar"><span>${s}</span><span class="tr"><span class="fl" style="display:block;width:${byS[i]/mx*100}%"></span></span><span class="n">${byS[i]}</span></div>`).join('')}</div></div>
  ${top.length?`<div class="card"><h2>${M.pannes} les plus fréquentes</h2><div class="bars">${top.map(([p,n])=>`<div class="bar"><span>${esc(p)}</span><span class="tr"><span class="fl" style="display:block;width:${n/mx2*100}%"></span></span><span class="n">${n}</span></div>`).join('')}</div></div>`:''}`;
}
function bindTableau(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>location.hash='fiche-'+b.dataset.open)}

// ===== Réglages : tarifs + atelier =====
let outAsk=false;
function vTarifs(){
  return `<h1>Grille de tarifs</h1><p class="muted small" style="margin:0">Remplie une seule fois. Les devis se calculent ensuite tout seuls. Les changements s'enregistrent automatiquement.</p>
  <div class="tblw"><table><thead><tr><th>${M.item}</th><th>${M.panne}</th><th>Prix client</th><th>Coût fourniture</th><th style="text-align:right">Marge</th><th></th></tr></thead><tbody>
  ${GRID.map((g,i)=>`<tr><td><input data-g="${i}" data-k="model" value="${esc(g.model)}" aria-label="${M.item}"></td><td><input data-g="${i}" data-k="panne" value="${esc(g.panne)}" aria-label="${M.panne}"></td>
  <td><input data-g="${i}" data-k="prix" type="number" class="mono" value="${g.prix}" style="width:76px" aria-label="Prix"></td><td><input data-g="${i}" data-k="cout" type="number" class="mono" value="${g.cout}" style="width:76px" aria-label="Coût"></td>
  <td class="m" id="mg${i}">${eur(g.prix-g.cout)}</td><td><button class="btn btn-s" data-del="${i}" aria-label="Supprimer la ligne">×</button></td></tr>`).join('')}
  </tbody></table></div>
  <button class="btn" id="addrow">+ Ajouter une ligne</button>
  <div class="card"><h2>Atelier</h2>
    <label class="f">Nom affiché aux clients<input id="s-name" value="${esc(A.nom)}"></label>
    <label class="f">Métier<select id="s-met">${Object.entries(METIERS).map(([k,v])=>`<option value="${k}" ${k===A.metier?'selected':''}>${esc(v.nom)}</option>`).join('')}</select></label>
    <div class="grid2"><label class="f">Téléphone<input id="s-tel" value="${esc(A.telephone||'')}"></label>
    <label class="f">Garantie (mois)<input id="s-gar" type="number" value="${A.garantie_mois}"></label></div>
    <label class="f">TVA<select id="s-tva"><option value="micro" ${A.tva==='micro'?'selected':''}>Micro-entreprise (TVA non applicable)</option><option value="tva" ${A.tva==='tva'?'selected':''}>TVA 20 % incluse</option></select></label></div>
  <div class="card"><h2>Compte</h2><div class="small">Connecté avec <b>${esc(USER?.email||'')}</b></div>
    ${outAsk?`<div class="grid2"><button class="btn" id="out-no">Annuler</button><button class="btn out" id="out-yes">Se déconnecter</button></div>`:`<button class="btn" id="out">Se déconnecter</button>`}</div>`;
}
const saveRow=debounce(async g=>{const {error}=await sb.from('tarifs').update({article:g.model,prestation:g.panne,prix:g.prix,cout:g.cout}).eq('id',g.id);if(error)fail(error,'Tarif non enregistré')},700);
const saveShop=debounce(async patch=>{const {error}=await sb.from('ateliers').update(patch).eq('id',A.id);if(error)fail(error,'Réglage non enregistré')},700);
function bindTarifs(){
  document.querySelectorAll('[data-g]').forEach(inp=>inp.oninput=()=>{const g=GRID[+inp.dataset.g],k=inp.dataset.k;g[k]=(k==='prix'||k==='cout')?(+inp.value||0):inp.value;$('#mg'+inp.dataset.g).textContent=eur(g.prix-g.cout);saveRow(g)});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const g=GRID[+b.dataset.del];b.disabled=true;const {error}=await sb.from('tarifs').delete().eq('id',g.id);if(error){b.disabled=false;fail(error,'Suppression impossible');return}GRID.splice(GRID.indexOf(g),1);render()});
  $('#addrow').onclick=async()=>{const b=$('#addrow');busy(b,true,'Ajout…');const row={atelier_id:A.id,article:GRID[0]?GRID[0].model:M.item,prestation:'Nouvelle prestation',prix:0,cout:0};
    const {data,error}=await sb.from('tarifs').insert(row).select().single();busy(b,false);if(error){fail(error,'Ajout impossible');return}
    GRID.push({id:data.id,model:data.article,panne:data.prestation,prix:0,cout:0});render()};
  $('#s-name').oninput=e=>{A.nom=e.target.value;$('#shopName').textContent=A.nom;saveShop({nom:A.nom})};
  $('#s-tel').oninput=e=>{A.telephone=e.target.value;saveShop({telephone:A.telephone})};
  $('#s-gar').oninput=e=>{A.garantie_mois=+e.target.value||0;saveShop({garantie_mois:A.garantie_mois})};
  $('#s-tva').onchange=e=>{A.tva=e.target.value;saveShop({tva:A.tva})};
  $('#s-met').onchange=e=>{A.metier=e.target.value;setM(A.metier);saveShop({metier:A.metier});render();toast('Métier : '+M.nom)};
  const o=$('#out');if(o)o.onclick=()=>{outAsk=true;render()};
  const n=$('#out-no');if(n)n.onclick=()=>{outAsk=false;render()};
  const y=$('#out-yes');if(y)y.onclick=()=>{outAsk=false;sb.auth.signOut()};
}

// ===== Routeur =====
function render(){
  const h=location.hash.slice(1)||'reparations',el=app();
  chrome(true);
  let tab=h;
  if(h.startsWith('fiche-')){const id=h.slice(6);el.innerHTML=vFiche(id);bindFiche(id);tab='reparations'}
  else if(h==='nouvelle'){el.innerHTML=vNew();bindNew()}
  else if(h==='tableau'){el.innerHTML=vTableau();bindTableau()}
  else if(h==='tarifs'){el.innerHTML=vTarifs();bindTarifs()}
  else{tab='reparations';el.innerHTML=vList();bindList()}
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.t===tab));
}
async function route(){
  const h=location.hash.slice(1);
  if(h.startsWith('suivi-')){await vSuivi(h.slice(6));return}
  if(!USER){vLogin();return}
  if(!A){await loadAll();return}
  render();
}
let lastH=null;
window.addEventListener('hashchange',()=>{route();if(lastH!==location.hash)window.scrollTo(0,0);lastH=location.hash});

sb.auth.onAuthStateChange((ev,session)=>{
  const u=session?.user||null;
  if(u&&(!USER||USER.id!==u.id)){USER=u;A=null;if(!location.hash.startsWith('#suivi-'))setTimeout(()=>{cleanHash();loadAll()},0)}
  else if(!u&&USER){USER=null;A=null;GRID=[];REPS=[];if(!location.hash.startsWith('#suivi-')){location.hash='';vLogin()}}
});
function cleanHash(){if(/access_token|refresh_token|type=|error=/.test(location.hash))history.replaceState(null,'',location.pathname+'#reparations')}

(async function boot(){
  const err=/error_description=([^&]+)/.exec(location.hash);
  const {data:{session}}=await sb.auth.getSession();
  if(location.hash.startsWith('#suivi-')){USER=session?.user||null;await vSuivi(location.hash.slice(7));return}
  if(err&&!session){cleanHash();vLogin(decodeURIComponent(err[1].replace(/\+/g,' ')));return}
  if(!session){vLogin();return}
  USER=session.user;cleanHash();await loadAll();
})();

</script>
</body>
</html>
