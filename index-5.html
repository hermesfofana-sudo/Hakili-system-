:root{

  --good:#1D7A45; --good-soft:#DDF1E4; --warn:#9A5B00; --warn-soft:#FBEBCF; --info:#2B5C9C; --info-soft:#DEE8F6; --crit:#B3261E;

:root[data-theme="dark"]{

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar{display:flex;align-items:center;gap:8px;padding-block:0 10px}
.mbar label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.mbar select{padding:7px 10px;font-weight:700}
.demo{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:4px 8px;border-radius:99px;white-space:nowrap}
main .wrap{padding-block:16px 110px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:13px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
button,.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-p{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-g{background:var(--good);color:var(--surface);border-color:var(--good)}
.btn-block{width:100%}
.btn-s{padding:7px 10px;font-size:13px}
.link{background:none;border:0;color:var(--accent);padding:0;font-weight:700;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-recu{color:var(--muted);background:var(--sunk)}
.s-diag{color:var(--info);background:var(--info-soft)}
.s-piece{color:var(--warn);background:var(--warn-soft)}
.s-rep{color:var(--accent);background:var(--accent-soft)}
.s-pret{color:var(--good);background:var(--good-soft)}
.s-rendu{color:var(--muted);background:transparent;border:1px solid var(--line)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.filters button{white-space:nowrap;padding:7px 12px;font-size:13px;border-radius:99px}
.filters button[aria-pressed="true"]{background:var(--navy);color:var(--surface);border-color:var(--navy)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink);width:100%;font-weight:500}
.item:hover{border-color:var(--accent)}
.item .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .p{font-family:var(--f-mono);font-weight:600;text-align:right}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 10px;cursor:pointer}
.checks input{width:auto;accent-color:var(--accent)}
.sig{width:100%;height:140px;background:var(--sunk);border:1px dashed var(--line);border-radius:10px;touch-action:none;display:block}
.price{font-family:var(--f-mono);font-size:28px;font-weight:600;letter-spacing:-.02em}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.steps i{height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.steps-l{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2}
.steps-l .on{color:var(--ink);font-weight:700}
.devis{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--sunk);display:flex;flex-direction:column;gap:8px;font-size:14px}
.devis .l{display:flex;justify-content:space-between;gap:10px}
.devis .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:800}
.tl{display:flex;flex-direction:column;gap:8px;font-size:13px}
.tl div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:600;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:13px}

th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--sunk)}
td{padding:6px 8px;border-bottom:1px solid var(--line)}

nav.tabs a.on{color:var(--accent)}
nav.tabs a.new span.ic{background:var(--accent);color:var(--on-accent);border-radius:10px;padding:3px 12px;display:flex}

.client-hero .big{font-size:26px;font-weight:800;letter-spacing:-.02em}
.note{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.item,button{transition:border-color .15s,background .15s}}

// ===== Dictée : analyse de la phrase =====
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const flat=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[’']/g,' ').replace(/\s+/g,' ').trim();
const PANNE_SYN=[[/\b(ecran|vitre avant|tactile|afficheur|ecran casse)\b/,'Écran'],[/\bbatterie\b/,'Batterie'],[/\b(connecteur|port de charge|charge (?:plus|pas|marche|ne)|ne charge|recharge|la charge)\b/,'Connecteur de charge'],
  [/\b(camera|appareil photo)\b/,'Caméra arrière'],[/\b(vitre arriere|dos casse|arriere casse)\b/,'Vitre arrière'],[/\b(oxyde|oxydation|tombe dans l eau|dans l eau|mouille)\b/,'Désoxydation'],[/\b(diagnostic|diag)\b/,'Diagnostic']];
function parseDictee(text,models,pannes){
  const t=flat(text),out={};
  // modèle : le plus long nom de la grille présent dans la phrase
  let best='';models.forEach(m=>{const f=flat(m);if(f&&t.includes(f)&&f.length>best.length){best=f;out.model=m}});
  if(!out.model){const x=/\b(iphone|galaxy|samsung|redmi|xiaomi|pixel|huawei|oppo|honor|motorola|macbook|ps5|ps4|switch|xbox)\b(\s+(?:se|note|pro|max|plus|ultra|lite|air|mini|[a-z]?\d{1,3}[a-z]?)){0,3}/.exec(t);
    if(x)out.model=x[0].replace(/\b\w/g,c=>c.toUpperCase()).replace(/^Iphone/,'iPhone').replace(/^Ps/,'PS').replace(/^Macbook/,'MacBook')}
  // prestation : nom de la grille, sinon synonyme courant
  let bp='';pannes.forEach(p=>{const f=flat(p);if(f&&t.includes(f)&&f.length>bp.length){bp=f;out.panne=p}});
  if(!out.panne){for(const [re,p] of PANNE_SYN){if(re.test(t)){const g=pannes.find(x=>flat(x)===flat(p));out.panne=g||p;break}}}
  if(!out.panne){const w=pannes.find(p=>{const f=flat(p).split(' ')[0];return f.length>3&&new RegExp('\\b'+f).test(t)});if(w)out.panne=w}
  // téléphone
  const tel=/(?:\+33|0)(?:[\s.-]*\d){9}/.exec(text);if(tel){const d=tel[0].replace(/\D/g,'').replace(/^33/,'0');out.tel=d.replace(/(\d{2})(?=\d)/g,'$1 ').trim()}
  // prix
  const px=/(\d{1,4})(?:[,.]\d{1,2})?\s*(?:€|euros?)/i.exec(text);if(px)out.prix=+px[1];
  // client
  const cl=/(?:client(?:e)?|pour|nom|monsieur|madame|m\.|mme)\s*:?\s+([A-Za-zÀ-ÖØ-öø-ÿ-]{2,}(?:\s+[A-ZÀ-Ö][\wÀ-ÖØ-öø-ÿ-]*\.?)?)/i.exec(text);
  if(cl){const n=cl[1].replace(/\s+(?:au|à|le|la|tel|téléphone|numéro|06|07)\b.*$/i,'');out.client=n.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ')}
  // état visuel : les morceaux qui décrivent un défaut
  const ER=/((?:(?!cass|écran|ecran|batterie)[^\s,.;]+\s+)?(?:rayure|rayé|rayée|rayures|fissure|fissuré|fissurée|fêlé|fêlée|enfoncé|enfoncée|tache|taché|tachée|usé|usée|abîmé|abîmée|bosse|choc|griffé|griffée|écaillé|écaillée|tordu|tordue|décollé|décollée|manque)(?:\s+(?!client|cliente|pour|nom|madame|monsieur|mme|tel|téléphone|\d)[^\s,.;]+){0,5})/gi;
  const seg=[...text.matchAll(ER)].map(x=>x[1].trim());
  if(seg.length)out.etat=seg.map(s=>s.charAt(0).toUpperCase()+s.slice(1)).join('. ')+'.';
  return out;
}

async function loadAll(){
  if(loading)return;loading=true;
  chrome(false);app().innerHTML='<div class="loading">Chargement de ton atelier…</div>';
  try{
    const {data:at,error}=await sb.from('ateliers').select('*').limit(1).maybeSingle();
    if(error)throw error;
    if(!at){A=null;loading=false;vOnboard();return}
    A=at;setM(A.metier);
    const [t,f,h]=await Promise.all([
      sb.from('tarifs').select('*').eq('atelier_id',A.id).order('article').order('prestation'),
      sb.from('fiches').select('*').eq('atelier_id',A.id).order('created_at',{ascending:false}),
      sb.from('historique').select('fiche_id,statut,at').order('at')
    ]);
    for(const x of [t,f,h])if(x.error)throw x.error;
    GRID=t.data.map(r=>({id:r.id,model:r.article,panne:r.prestation,prix:+r.prix||0,cout:+r.cout||0}));
    const H={};h.data.forEach(x=>(H[x.fiche_id]=H[x.fiche_id]||[]).push({s:x.statut,d:x.at}));
    REPS=f.data.map(r=>toRep(r,H[r.id]||[]));
    loading=false;render();
  }catch(e){loading=false;console.error(e);
    app().innerHTML=`<div class="card"><h1>Connexion impossible</h1><p class="err">${esc(e.message||e)}</p><p class="small muted" style="margin:0">Vérifie que les tables Supabase sont bien créées, puis recharge la page.</p><button class="btn" id="retry">Réessayer</button></div>`;
    $('#retry').onclick=loadAll}
}

      <button class="btn btn-p btn-block" type="submit" id="l-go">${mode==='in'?'Se connecter':'Créer mon compte'}</button></form>
    <button class="link small" id="l-sw" style="align-self:flex-start">${mode==='in'?'Pas encore de compte ? Créer un compte':'Déjà un compte ? Se connecter'}</button></div>
    <div class="card demo-cta"><h2>Découvrir sans compte</h2><p class="small muted" style="margin:0">Une démo complète avec des exemples, pour ton métier. Rien n'est enregistré.</p>
    <button class="btn btn-block" id="l-demo">Voir la démo</button></div>`;
  $('#l-demo').onclick=()=>enterDemo('phone');
  $('#l-sw').onclick=()=>{mode=mode==='in'?'up':'in';msg='';const m=$('#l-mail').value;draw();$('#l-mail').value=m};
  $('#lf').onsubmit=async e=>{e.preventDefault();
    const email=$('#l-mail').value.trim().toLowerCase(),password=$('#l-pass').value;
    if(!/^\S+@\S+\.\S+$/.test(email)){toast('Entre une adresse e-mail valide');return}
    if(password.length<8){toast('Le mot de passe doit faire au moins 8 caractères');return}
    const b=$('#l-go');busy(b,true,mode==='in'?'Connexion…':'Création…');
    if(mode==='in'){
      const {error}=await sb.auth.signInWithPassword({email,password});
      busy(b,false);
      if(error){fail(error,/invalid/i.test(error.message)?'E-mail ou mot de passe incorrect.':'Connexion impossible : '+error.message)}
    }else{
      const {data,error}=await sb.auth.signUp({email,password});
      busy(b,false);
      if(error){fail(error,/registered|exists/i.test(error.message)?'Ce compte existe déjà. Connecte-toi.':'Création impossible : '+error.message);return}
      if(!data.session){toast('Compte créé. Valide l\'e-mail reçu, puis connecte-toi.');mode='in';draw();$('#l-mail').value=email}
    }
  };
  };
  draw();
}

    }}
  $('#n-photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.75);const pv=$('#n-prev');pv.src=photoData;pv.hidden=false};im.src=rd.result};rd.readAsDataURL(f)};
  const cv=$('#sig'),ctx=cv.getContext('2d');
  const r0=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r0.width*dpr;cv.height=r0.height*dpr;ctx.scale(dpr,dpr);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.strokeStyle=getComputedStyle(document.body).color;
  let dn=false;const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{dn=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y)};
  cv.onpointermove=e=>{if(!dn)return;const[x,y]=pt(e);ctx.lineTo(x,y);ctx.stroke();sigDrawn=true};

    const row={id,atelier_id:A.id,client,telephone:$('#n-tel').value.trim(),article:m.value.trim(),prestation:p.value.trim(),prix:+pr.value||0,cout:g?g.cout:0,statut:0,

      sb.from('tarifs').insert(t).select().single().then(({data:d})=>{if(d)GRID.push({id:d.id,model:d.article,panne:d.prestation,prix:+d.prix||0,cout:0})})}

    location.hash='fiche-'+id;

}

  return `<h1>Grille de tarifs</h1><p class="muted small" style="margin:0">Remplie une seule fois. Les devis se calculent ensuite tout seuls. Les changements s'enregistrent automatiquement.</p>
  <div class="tblw"><table><thead><tr><th>${M.item}</th><th>${M.panne}</th><th>Prix client</th><th>Coût fourniture</th><th style="text-align:right">Marge</th><th></th></tr></thead><tbody>
  ${GRID.map((g,i)=>`<tr><td><input data-g="${i}" data-k="model" value="${esc(g.model)}" aria-label="${M.item}"></td><td><input data-g="${i}" data-k="panne" value="${esc(g.panne)}" aria-label="${M.panne}"></td>
  <td><input data-g="${i}" data-k="prix" type="number" class="mono" value="${g.prix}" style="width:76px" aria-label="Prix"></td><td><input data-g="${i}" data-k="cout" type="number" class="mono" value="${g.cout}" style="width:76px" aria-label="Coût"></td>
  <td class="m" id="mg${i}">${eur(g.prix-g.cout)}</td><td><button class="btn btn-s" data-del="${i}" aria-label="Supprimer la ligne">×</button></td></tr>`).join('')}
  </tbody></table></div>
  <div class="grid2"><button class="btn" id="addrow">+ Ajouter une ligne</button><button class="btn" id="addstd">Ajouter les modèles courants</button></div>
  <div class="card"><h2>Atelier</h2>
    <label class="f">Nom affiché aux clients<input id="s-name" value="${esc(A.nom)}"></label>
    <label class="f">Métier<select id="s-met">${Object.entries(METIERS).map(([k,v])=>`<option value="${k}" ${k===A.metier?'selected':''}>${esc(v.nom)}</option>`).join('')}</select></label>
    <div class="grid2"><label class="f">Téléphone<input id="s-tel" value="${esc(A.telephone||'')}"></label>
    <label class="f">Garantie (mois)<input id="s-gar" type="number" value="${A.garantie_mois}"></label></div>
    <label class="f">TVA<select id="s-tva"><option value="micro" ${A.tva==='micro'?'selected':''}>Micro-entreprise (TVA non applicable)</option><option value="tva" ${A.tva==='tva'?'selected':''}>TVA 20 % incluse</option></select></label>
    <label class="f">Lien d'avis Google<input id="s-avis" inputmode="url" placeholder="https://g.page/r/…" value="${esc(A.avis_url||'')}"></label>
    <p class="note" style="margin:0">Pour le trouver : cherche ton atelier sur Google Maps, puis « Demander des avis » dans ta fiche d'établissement, et copie le lien.</p></div>
  ${DEMO?`<div class="card"><h2>Démo</h2><p class="small muted" style="margin:0">Tu es dans la démo : les exemples sont fictifs et rien n'est enregistré.</p><button class="btn btn-p btn-block" id="demo-signup">Créer mon vrai compte</button></div>`:`<div class="card"><h2>Compte</h2><div class="small">Connecté avec <b>${esc(USER?.email||'')}</b></div>
    ${outAsk?`<div class="grid2"><button class="btn" id="out-no">Annuler</button><button class="btn out" id="out-yes">Se déconnecter</button></div>`:`<button class="btn" id="out">Se déconnecter</button>`}</div>`}`;
}
const saveRow=debounce(async g=>{const {error}=await sb.from('tarifs').update({article:g.model,prestation:g.panne,prix:g.prix,cout:g.cout}).eq('id',g.id);if(error)fail(error,'Tarif non enregistré')},700);
const saveShop=debounce(async patch=>{const {error}=await sb.from('ateliers').update(patch).eq('id',A.id);if(error)fail(error,'Réglage non enregistré')},700);
function bindTarifs(){
  document.querySelectorAll('[data-g]').forEach(inp=>inp.oninput=()=>{const g=GRID[+inp.dataset.g],k=inp.dataset.k;g[k]=(k==='prix'||k==='cout')?(+inp.value||0):inp.value;$('#mg'+inp.dataset.g).textContent=eur(g.prix-g.cout);saveRow(g)});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const g=GRID[+b.dataset.del];b.disabled=true;const {error}=await sb.from('tarifs').delete().eq('id',g.id);if(error){b.disabled=false;fail(error,'Suppression impossible');return}GRID.splice(GRID.indexOf(g),1);render()});
  $('#addstd').onclick=async()=>{const b=$('#addstd');const have=new Set(GRID.map(g=>norm(g.model)+'|'+norm(g.panne)));
    const rows=M.grid.filter(([a,p])=>!have.has(norm(a)+'|'+norm(p))).map(([article,prestation,prix,cout])=>({atelier_id:A.id,article,prestation,prix,cout}));
    if(!rows.length){toast('Tous les modèles courants sont déjà dans ta grille');return}
    busy(b,true,'Ajout…');const {data,error}=await sb.from('tarifs').insert(rows).select();busy(b,false);if(error){fail(error,'Ajout impossible');return}
    data.forEach(r=>GRID.push({id:r.id,model:r.article,panne:r.prestation,prix:+r.prix||0,cout:+r.cout||0}));toast(data.length+' lignes ajoutées');render()};
  $('#addrow').onclick=async()=>{const b=$('#addrow');busy(b,true,'Ajout…');const row={atelier_id:A.id,article:GRID[0]?GRID[0].model:M.item,prestation:'Nouvelle prestation',prix:0,cout:0};
    const {data,error}=await sb.from('tarifs').insert(row).select().single();busy(b,false);if(error){fail(error,'Ajout impossible');return}
    GRID.push({id:data.id,model:data.article,panne:data.prestation,prix:0,cout:0});render()};
  $('#s-name').oninput=e=>{A.nom=e.target.value;$('#shopName').textContent=A.nom;saveShop({nom:A.nom})};
  $('#s-tel').oninput=e=>{A.telephone=e.target.value;saveShop({telephone:A.telephone})};
  $('#s-gar').oninput=e=>{A.garantie_mois=+e.target.value||0;saveShop({garantie_mois:A.garantie_mois})};
  $('#s-tva').onchange=e=>{A.tva=e.target.value;saveShop({tva:A.tva})};
  $('#s-avis').oninput=e=>{A.avis_url=e.target.value.trim();saveShop({avis_url:A.avis_url||null})};
  $('#s-met').onchange=e=>{A.metier=e.target.value;setM(A.metier);saveShop({metier:A.metier});render();toast('Métier : '+M.nom)};
  const ds=$('#demo-signup');if(ds)ds.onclick=()=>exitDemo(true);
  const o=$('#out');if(o)o.onclick=()=>{outAsk=true;render()};
  const n=$('#out-no');if(n)n.onclick=()=>{outAsk=false;render()};
  const y=$('#out-yes');if(y)y.onclick=()=>{outAsk=false;sb.auth.signOut()};
}

// ===== Mode démo : mêmes écrans, données locales, rien n'est enregistré =====
let DEMO=null;
function makeDemoClient(mid){
  const MT=METIERS[mid],now=Date.now(),day=864e5,iso=t=>new Date(t).toISOString();
  const D={ateliers:[],tarifs:[],fiches:[],historique:[]},files={};
  const uid=()=>(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));
  let num=140;
  D.ateliers.push({id:'demo',nom:MT.atelier,metier:mid,telephone:'05 56 00 00 00',garantie_mois:6,tva:'micro',avis_url:'https://g.page/r/exemple-avis',created_at:iso(now)});
  MT.grid.forEach(([article,prestation,prix,cout])=>D.tarifs.push({id:uid(),atelier_id:'demo',article,prestation,prix,cout}));
  const people=[['Lucas B.','06 11 22 33 44'],['Sofia R.','06 21 32 43 54'],['Camille D.','07 81 72 63 54'],['Jake T.','06 45 56 67 78'],['Inès M.','06 98 87 76 65'],['Emma G.','06 12 23 34 45'],['Yanis A.','07 23 34 45 56'],['Léa P.','06 34 45 56 67'],['Mamadou K.','06 56 67 78 89']];
  MT.reps.forEach(([gi,st,k],i)=>{
    const g=MT.grid[gi]||MT.grid[0];if(st===4)k=Math.max(k,10);
    const id=uid(),t0=now-k*day-3600e3*(i+1);
    D.fiches.push({id,atelier_id:'demo',numero:++num,client:people[i][0],telephone:people[i][1],article:g[0],prestation:g[1],prix:g[2],cout:g[3],statut:st,
      tests:i===3?MT.tests.slice(2,5):MT.tests.slice(0,6),etat:i===4?MT.etatDemo:'',numero_serie:null,photo_path:null,signature_path:null,suivi_token:uid(),relance_at:null,created_at:iso(t0)});
    const span=st===4?(k-9)*day:k*day*0.8;
    for(let j=0;j<=st;j++)D.historique.push({fiche_id:id,statut:j,at:iso(Math.min(now-60e3,t0+(st?j*span/st:0)))});
  });
  const fill=(t,r)=>{r=Object.assign({},r);if(!r.id)r.id=uid();
    if(t==='fiches'){r.numero=++num;r.suivi_token=r.suivi_token||uid();r.created_at=iso(Date.now());r.statut=r.statut||0;r.tests=r.tests||[];r.relance_at=null}
    if(t==='tarifs'){r.prix=+r.prix||0;r.cout=+r.cout||0}return r};
  const from=t=>{
    let op='select',payload=null;const filters=[],orders=[];let lim=null;
    const match=r=>filters.every(([k,v])=>r[k]===v);
    const run=()=>{let out=[];const T=D[t];
      if(op==='select'){out=T.filter(match);orders.slice().reverse().forEach(([k,d])=>out.sort((x,y)=>x[k]>y[k]?d:x[k]<y[k]?-d:0));if(lim)out=out.slice(0,lim)}
      else if(op==='insert'){out=(Array.isArray(payload)?payload:[payload]).map(r=>fill(t,r));T.push(...out);
        if(t==='fiches')out.forEach(f=>D.historique.push({fiche_id:f.id,statut:f.statut,at:f.created_at}))}
      else if(op==='update'){T.filter(match).forEach(r=>{const old=r.statut;Object.assign(r,payload);
        if(t==='fiches'&&'statut' in payload&&payload.statut!==old)D.historique.push({fiche_id:r.id,statut:r.statut,at:iso(Date.now())})});out=T.filter(match)}
      else if(op==='delete'){D[t]=T.filter(r=>!match(r))}
      return Promise.resolve({data:JSON.parse(JSON.stringify(out)),error:null})};
    const q={select(){return q},eq(k,v){filters.push([k,v]);return q},order(k,o){orders.push([k,o&&o.ascending===false?-1:1]);return q},limit(n){lim=n;return q},
      insert(r){op='insert';payload=r;return q},update(p){op='update';payload=p;return q},delete(){op='delete';return q},
      maybeSingle(){return run().then(r=>({data:(r.data||[])[0]||null,error:null}))},single(){return run().then(r=>({data:(r.data||[])[0]||null,error:null}))},
      then(a,b){return run().then(a,b)}};
    return q};
  return {from,
    rpc:(fn,{p_token})=>{const f=D.fiches.find(x=>x.suivi_token===p_token);if(!f)return Promise.resolve({data:null,error:null});const a=D.ateliers[0];
      return Promise.resolve({data:{atelier:a.nom,telephone:a.telephone,metier:a.metier,garantie_mois:a.garantie_mois,numero:f.numero,article:f.article,prestation:f.prestation,prix:f.prix,statut:f.statut,depose_le:f.created_at,
        historique:D.historique.filter(h=>h.fiche_id===f.id)},error:null})},
    storage:{from:()=>({upload:(p,blob)=>{files[p]=URL.createObjectURL(blob);return Promise.resolve({error:null})},
      createSignedUrl:p=>Promise.resolve(files[p]?{data:{signedUrl:files[p]},error:null}:{data:null,error:{message:'absent'}})})},
    auth:{signOut:()=>{exitDemo();return Promise.resolve({})}}};
}
async function enterDemo(mid){
  if(!METIERS[mid])mid='phone';
  DEMO=mid;sb=makeDemoClient(mid);USER={id:'demo',email:'démo'};A=null;filter='encours';q='';
  const u=new URL(location.href);u.searchParams.set('demo',mid);if(!location.hash.startsWith('#suivi-'))u.hash='reparations';history.replaceState(null,'',u.toString());
  demoBar();await loadAll();
}
function exitDemo(signup){
  DEMO=null;sb=realSb;USER=null;A=null;GRID=[];REPS=[];
  history.replaceState(null,'',location.pathname);demoBar();vLogin('',signup?'up':'in');
}
function demoBar(){
  const b=$('#demobar');if(!b)return;b.hidden=!DEMO;if(!DEMO)return;
  b.innerHTML=`<div class="wrap db"><span class="db-l">Démo</span><select id="db-met" aria-label="Métier de la démo">${Object.entries(METIERS).map(([k,v])=>`<option value="${k}" ${k===DEMO?'selected':''}>${esc(v.nom)}</option>`).join('')}</select><button class="link small" id="db-out">Quitter</button></div>`;
  $('#db-met').onchange=e=>{enterDemo(e.target.value);toast('Démo : '+METIERS[e.target.value].nom)};
  $('#db-out').onclick=()=>exitDemo();
}

// ===== Routeur =====
function render(){
  const h=location.hash.slice(1)||'reparations',el=app();
  chrome(true);
  let tab=h;
  if(h.startsWith('fiche-')){const id=h.slice(6);el.innerHTML=vFiche(id);bindFiche(id);tab='reparations'}
  else if(h==='nouvelle'){el.innerHTML=vNew();bindNew()}
  else if(h==='tableau'){el.innerHTML=vTableau();bindTableau()}
  else if(h==='tarifs'){el.innerHTML=vTarifs();bindTarifs()}
  else{tab='reparations';el.innerHTML=vList();bindList()}
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.t===tab));
}
async function route(){
  const h=location.hash.slice(1);
  if(h.startsWith('suivi-')){await vSuivi(h.slice(6));return}
  if(!USER){vLogin();return}
  if(!A){await loadAll();return}
  render();
}
let lastH=null;
window.addEventListener('hashchange',()=>{route();if(lastH!==location.hash)window.scrollTo(0,0);lastH=location.hash});

sb.auth.onAuthStateChange((ev,session)=>{
  if(DEMO)return;
  const u=session?.user||null;
  if(u&&(!USER||USER.id!==u.id)){USER=u;A=null;if(!location.hash.startsWith('#suivi-'))setTimeout(()=>{cleanHash();loadAll()},0)}
  else if(!u&&USER){USER=null;A=null;GRID=[];REPS=[];if(!location.hash.startsWith('#suivi-')){location.hash='';vLogin()}}
});
function cleanHash(){if(/access_token|refresh_token|type=|error=/.test(location.hash))history.replaceState(null,'',location.pathname+'#reparations')}

const realSb=sb;
(async function boot(){
  const dm=new URLSearchParams(location.search).get('demo');
  if(dm!==null){const h=location.hash;await enterDemo(dm||'phone');if(h.startsWith('#suivi-'))await vSuivi(h.slice(7));return}
  const err=/error_description=([^&]+)/.exec(location.hash);
  const {data:{session}}=await sb.auth.getSession();
  if(location.hash.startsWith('#suivi-')){USER=session?.user||null;await vSuivi(location.hash.slice(7));return}
  if(err&&!session){cleanHash();vLogin(decodeURIComponent(err[1].replace(/\+/g,' ')));return}
  if(!session){vLogin();return}
  USER=session.user;cleanHash();await loadAll();
})();

</script>
